<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>M0B1Li7Y — Fresh Start</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="app-header">
        <h1>M0B1Li7Y</h1>
        <p class="subhead">Daily mobility routine</p>
      </header>

      <section class="status" aria-live="polite">
        <p id="progress-label">Step 1 of 12</p>
        <p id="session-count">Sessions completed: 0</p>
      </section>

      <section class="step-card">
        <p id="step-chip" class="chip">Warmup</p>
        <h2 id="step-name">Arm Circles</h2>
        <p id="step-cue">Smooth shoulder circles.</p>
        <img id="step-image" alt="Routine step visual" />
        <p id="timer" class="timer">00:30</p>
      </section>

      <section class="controls" aria-label="Routine controls">
        <button id="start-btn" class="btn btn-primary">Start</button>
        <button id="pause-btn" class="btn" disabled>Pause</button>
        <button id="back-btn" class="btn" disabled>Back</button>
        <button id="next-btn" class="btn" disabled>Next</button>
        <button id="reset-btn" class="btn">Reset</button>
      </section>

      <section class="asset-check">
        <h3>Saved assets check</h3>
        <p id="summary"></p>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
